
name: Daily Shop Sales Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-shop-sales
  cancel-in-progress: false

jobs:
  update-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily sales
        working-directory: python
        run: python generate_sales.py

      - name: Clean and validate sales data
        working-directory: python
        run: python script.py

      - name: Export dashboard data
        working-directory: python
        run: python export_data.py

      - name: Update dashboard JSON
        run: |
          cp python/sales_data.json docs/sales_data.json

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sales_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated daily sales update"
            git push
          fi
