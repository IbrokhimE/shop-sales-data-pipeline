
name: Daily Local Events Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: local-events-update
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch upcoming local events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python python/fetch_events.py

      - name: Check whether events changed
        id: changes
        run: |
          if git diff --quiet -- docs/local_events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated events
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/local_events.json
          git commit -m "Update local events data"
          git push
